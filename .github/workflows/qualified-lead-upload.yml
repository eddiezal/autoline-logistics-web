# Daily "Qualified lead (priced)" upload to Google Ads via the Data Manager API.
#
# Replaces the Monday-by-hand CSV upload (2026-08 → 2026-09). Runs every day
# at 02:00 UTC (7 PM PDT / 6 PM PST), after the day's pricing, with a 3-day
# window; ONE_PER_CLICK on the action dedups the overlap.
#
# Google auth: keyless via Workload Identity Federation. The auto-line-logistics
# org policy blocks service-account key creation (confirmed 2026-09-30), so the
# job exchanges GitHub's OIDC token for a short-lived Google credential and
# impersonates qualified-upload@auto-line-logistics.iam.gserviceaccount.com
# (roles/datastore.viewer). google-github-actions/auth writes a credential
# config file and exports GOOGLE_APPLICATION_CREDENTIALS; firebase-admin's
# applicationDefault() picks it up. One-time GCP setup is in the ledger:
# claude/qualified-shadow-upload-2026-09-30.md.
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   FIREBASE_PROJECT_ID
#   GOOGLE_ADS_DEVELOPER_TOKEN
#   GOOGLE_ADS_CLIENT_ID
#   GOOGLE_ADS_CLIENT_SECRET
#   GOOGLE_ADS_REFRESH_TOKEN       must be minted WITH the datamanager scope
#                                  (scripts/mint-ads-refresh-token.mjs, 2026-09-30+)
# Variables:
#   QUALIFIED_PRIMARY_OK           set to "true" only after the action is
#                                  deliberately promoted to S5's bidding goal.
#                                  Until then the script's safety rail aborts
#                                  if someone promotes it by accident.
#
# Manual run: Actions → this workflow → Run workflow (choose days / validate-only).
name: qualified-lead-upload

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Window in days (default 3)"
        default: "3"
      validate_only:
        description: "Validate payload without ingesting"
        type: boolean
        default: false

concurrency:
  group: qualified-lead-upload
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Google auth (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/184060108234/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: qualified-upload@auto-line-logistics.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Upload qualified leads (Data Manager API)
        run: |
          DAYS="${{ github.event.inputs.days || '3' }}"
          MODE="--apply"
          if [ "${{ github.event.inputs.validate_only }}" = "true" ]; then MODE="--validate-only"; fi
          node scripts/upload-qualified-shadow.mjs --datamanager --days "$DAYS" $MODE --env /dev/null
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          QUALIFIED_PRIMARY_OK: ${{ vars.QUALIFIED_PRIMARY_OK }}

